name: Security Scan Gate

on:
  push:
    branches: [main, master, develop, staging, dev]
  pull_request:
    branches: [main, master, develop, staging, dev]

jobs:
  security-scan:
    runs-on: ubuntu-latest
    name: Security Gate Checks
    permissions:
      security-events: write
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Full history for better detection

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    # 1. TruffleHog - verified secrets only, blocks the merge
    - name: Scan for high-entropy secrets with TruffleHog
      if: github.event_name == 'pull_request'
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./
        base: ${{ github.event.repository.default_branch }}
        head: HEAD
        extra_args: --only-verified
      continue-on-error: false  # verified hits are high-confidence: never let these pass

    # 2. GitGuardian - known signature scanning, blocks the merge
    - name: Run GitGuardian scan
      if: github.actor != 'dependabot[bot]'  # skip bot PRs to avoid noise/quota burn
      uses: GitGuardian/ggshield-action@master
      env:
        GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
      with:
        args: secret scan ci --verbose
      continue-on-error: false

    # 3. Semgrep - SAST with native SARIF output
    - name: Run Semgrep security checks
      run: |
        python -m pip install semgrep
        semgrep --config=p/security-audit --config=p/owasp-top-ten --config=p/python \
          --sarif --output=semgrep.sarif . || true

    # 4. Upload Semgrep results to GitHub Security
    - name: Upload Semgrep SARIF
      uses: github/codeql-action/upload-sarif@v4
      if: always() && hashFiles('semgrep.sarif') != '' && github.event_name != 'pull_request_target'
      with:
        sarif_file: semgrep.sarif
        category: semgrep
        wait-for-processing: true

    # 5. Snyk (SCA - Software Composition Analysis)
    - name: Run Snyk to check for vulnerabilities
      uses: snyk/actions/python@v1
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        args: --all-projects --severity-threshold=high --json-file-output=snyk-report.json
      continue-on-error: true

    - name: Upload Snyk report
      if: always() && hashFiles('snyk-report.json') != ''
      uses: actions/upload-artifact@v4
      with:
        name: snyk-security-report
        path: snyk-report.json
        retention-days: 30

    # 6. detect-secrets - entropy/regex baseline scan
    - name: Install detect-secrets
      run: python -m pip install detect-secrets

    - name: Run detect-secrets scan
      run: |
        detect-secrets scan --all-files --force-use-all-plugins --baseline .secrets.baseline
      continue-on-error: true

    - name: Check if .gitignore properly excludes sensitive files
      run: |
        python << 'EOF'
        import os
        import re

        sensitive_patterns = [
            r'\.env',
            r'\.pem$',
            r'\.key$',
            r'\.p12$',
            r'\.pfx$',
            r'secrets\.json',
            r'credentials\.json',
            r'_secrets\.json',
        ]

        exclude_dirs = {'.git', '.github', '.pytest_cache', 'myenv', '__pycache__', '.venv', 'node_modules'}
        untracked_sensitive = []

        for root, dirs, files in os.walk('.'):
            dirs[:] = [d for d in dirs if d not in exclude_dirs]

            for file in files:
                filepath = os.path.join(root, file).lstrip('./')

                for pattern in sensitive_patterns:
                    if re.search(pattern, filepath, re.IGNORECASE):
                        untracked_sensitive.append(filepath)
                        break

        if untracked_sensitive:
            print("[!] WARNING: Potential sensitive files found:")
            for f in untracked_sensitive:
                print(f"    - {f}")
            print("[!] Please add these to .gitignore")
        else:
            print("[+] No obvious sensitive files found")
        EOF

    # 7. Consolidated ShadowMapper secret & sensitive-file scan (the hard gate)
    - name: Run Consolidated ShadowMapper Security Scan
      run: |
        python << 'EOF'
        import os
        import re
        import sys

        sensitive_patterns = [
            r'\.env', r'\.pem$', r'\.key$', r'\.p12$', r'\.pfx$',
            r'secrets?\.json', r'credentials?\.json', r'config\.php',
            r'wp-config', r'settings\.py', r'web\.config'
        ]

        secret_patterns = {
            'api_key': r'["\']?api[_-]?key["\']?\s*[:=]\s*["\']?[a-zA-Z0-9]{20,}',
            'aws_key': r'AKIA[0-9A-Z]{16}',
            'private_key': r'-----BEGIN (RSA|DSA|EC|OPENSSH) PRIVATE KEY',
            'db_connection': r'(postgres|mysql|mongodb)://[a-zA-Z0-9:@/\-_.~?]+',
            'jwt_token': r'eyJ[A-Za-z0-9_-]+\.eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+',
            'github_token': r'gh[pousr]_[A-Za-z0-9_]{36,255}',
            'password_in_code': r'password\s*[:=]\s*["\'][^"\']{6,}["\']',
            'env_var_exposed': r'export\s+\w+=["\'][^"\']{8,}["\']',
        }

        exclude_dirs = {'.git', '.github', '.pytest_cache', 'myenv', '__pycache__', '.venv', 'node_modules'}
        found_issues = []

        print("[*] Launching ShadowMapper Consolidated Scan...")
        for root, dirs, files in os.walk('.'):
            dirs[:] = [d for d in dirs if d not in exclude_dirs]
            for file in files:
                if file.endswith(('.pyc', '.so', '.dll', '.exe', '.bin', '.jpg', '.png', '.zip')):
                    continue
                filepath = os.path.join(root, file).lstrip('./')

                for pattern in sensitive_patterns:
                    if re.search(pattern, filepath, re.IGNORECASE):
                        found_issues.append(f"Sensitive File: {filepath}")
                        print(f"    [!] Sensitive file found: {filepath}")
                        break

                try:
                    with open(filepath, 'r', encoding='utf-8', errors='ignore') as f:
                        content = f.read()
                except Exception:
                    continue

                for pattern_name, pattern in secret_patterns.items():
                    if re.search(pattern, content, re.IGNORECASE):
                        found_issues.append(f"Exposed {pattern_name} in {filepath}")
                        print(f"    [!] Potential {pattern_name} in {filepath}")

        if found_issues:
            print(f"\n[!] FAILURE: {len(found_issues)} security issues detected!")
            sys.exit(1)
        print("[+] ShadowMapper verification passed.")
        EOF

    - name: Report security scan results
      if: always()
      run: |
        echo "Security Gate Checks Completed"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "[gate]  TruffleHog        - verified high-entropy secrets (blocking)"
        echo "[gate]  GitGuardian       - known leaked-secret signatures (blocking)"
        echo "[gate]  ShadowMapper scan - sensitive files & secret patterns (blocking)"
        echo "[info]  Semgrep SAST      - code vulnerabilities (uploaded to Security tab)"
        echo "[info]  Snyk SCA          - dependency vulnerabilities (uploaded as artifact)"
        echo "[info]  detect-secrets    - baseline secret scan"
        echo "[info]  .gitignore check  - sensitive filename tracking"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
