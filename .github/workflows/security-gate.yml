name: Security Scan Gate

on:
  push:
    branches: [main, master, develop, staging, dev]
  pull_request:
    branches: [main, master, develop, staging, dev]

jobs:
  security-scan:
    runs-on: ubuntu-latest
    name: Security Gate Checks
    permissions:
      security-events: write
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Full history for better detection

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    # 1. ShadowMapper Core Scan
    - name: Run ShadowMapper Secret Scan
      run: |
        python << 'SHADOWMAPPER_EOF'
        import os
        import re
        import sys
        
        try:
            from core.wayback import grep_sensitive_urls
        except ImportError as e:
            print(f"[!] ERROR: Could not import core.wayback: {e}")
            print("[!] Skipping ShadowMapper Core Scan")
            sys.exit(0)
        
        # Patterns for sensitive file detection
        sensitive_patterns = [
            r'\.env', r'\.pem$', r'\.key$', r'\.p12$', r'\.pfx$',
            r'secrets?\.json', r'credentials?\.json', r'config\.php',
            r'wp-config', r'settings\.py', r'web\.config'
        ]
        
        exclude_dirs = {'.git', '.github', '.pytest_cache', 'myenv', '__pycache__', '.venv', 'node_modules', '.venv'}
        found_issues = []
        scanned_files = 0
        
        # 1. Check for sensitive files
        print("[*] Scanning for sensitive files...")
        for root, dirs, files in os.walk('.'):
            dirs[:] = [d for d in dirs if d not in exclude_dirs]
            
            for file in files:
                filepath = os.path.join(root, file).lstrip('./')
                
                for pattern in sensitive_patterns:
                    if re.search(pattern, filepath, re.IGNORECASE):
                        found_issues.append(filepath)
                        print(f"    [!] Sensitive file found: {filepath}")
                        break
        
        # 2. Scan Python files for sensitive content patterns
        print("[*] Scanning Python files for sensitive patterns...")
        content_patterns = {
            'api_key': r'["\']?api[_-]?key["\']?\s*[:=]\s*["\']?[a-zA-Z0-9]{16,}',
            'password': r'password\s*[:=]\s*["\'][^"\']+["\']',
            'token': r'(token|secret)\s*[:=]\s*["\'][^"\']+["\']',
            'private_key': r'-----BEGIN (RSA|DSA|EC|OPENSSH) PRIVATE KEY'
        }
        
        for root, dirs, files in os.walk('.'):
            dirs[:] = [d for d in dirs if d not in exclude_dirs]
            
            for file in files:
                if not file.endswith('.py'):
                    continue
                    
                filepath = os.path.join(root, file).lstrip('./')
                
                try:
                    with open(filepath, 'r', encoding='utf-8', errors='ignore') as f:
                        content = f.read()
                        scanned_files += 1
                        
                    for pattern_name, pattern in content_patterns.items():
                        if re.search(pattern, content, re.IGNORECASE):
                            found_issues.append(f"{filepath} (pattern: {pattern_name})")
                            print(f"    [!] Potential {pattern_name} in {filepath}")
                except Exception as e:
                    print(f"    [!] Could not read {filepath}: {e}")
        
        # Summary and exit
        print(f"\n[*] Scan complete: {scanned_files} Python files scanned")
        if found_issues:
            print(f"\n[!] SECURITY ALERT: Found {len(found_issues)} potential security issues:")
            for issue in found_issues:
                print(f"    - {issue}")
            print("\n[!] FAILURE: Do not push this code!")
            sys.exit(1)
        else:
            print("[+] ✓ ShadowMapper scan passed: No obvious secrets detected")
            sys.exit(0)
        SHADOWMAPPER_EOF

    # 2. TruffleHog - Entropy-based secrets detection (API keys, tokens, etc.)
    - name: Scan for high-entropy secrets with TruffleHog
      if: github.event_name == 'pull_request'
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./
        base: ${{ github.event.repository.default_branch }}
        head: HEAD
        extra_args: --only-verified
      continue-on-error: true

    # 3. GitGuardian - Entropy-based secrets detection (API keys, tokens, etc.)
    - name: Run GitGuardian scan
      uses: GitGuardian/ggshield-action@master
      env:
        GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
      with:
        args: --verbose --exit-zero
      continue-on-error: true

    # 4. Semgrep - SAST (Static Application Security Testing)
    - name: Run Semgrep security checks
      run: |
        python -m pip install semgrep
        semgrep --config=p/security-audit --config=p/owasp-top-ten --config=p/python \
          --json --output=semgrep-output.json . || true
        
        # Convert JSON to SARIF format for GitHub
        python << 'CONVERT_EOF'
        import json
        
        try:
            with open('semgrep-output.json', 'r') as f:
                semgrep_data = json.load(f)
            
            # Basic SARIF conversion
            sarif_output = {
                "version": "2.1.0",
                "$schema": "https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json",
                "runs": [{
                    "tool": {
                        "driver": {
                            "name": "Semgrep",
                            "version": "1.0.0",
                            "informationUri": "https://semgrep.dev"
                        }
                    },
                    "results": []
                }]
            }
            
            # Convert results
            if "results" in semgrep_data:
                for result in semgrep_data["results"]:
                    sarif_result = {
                        "ruleId": result.get("check_id", "unknown"),
                        "message": {"text": result.get("extra", {}).get("message", "Security issue found")},
                        "locations": [{
                            "physicalLocation": {
                                "artifactLocation": {"uri": result.get("path", "unknown")},
                                "region": {
                                    "startLine": result.get("start", {}).get("line", 1),
                                    "endLine": result.get("end", {}).get("line", 1)
                                }
                            }
                        }],
                        "level": "warning"
                    }
                    sarif_output["runs"][0]["results"].append(sarif_result)
            
            with open('semgrep.sarif', 'w') as f:
                json.dump(sarif_output, f, indent=2)
            
            print(f"✓ Generated SARIF file with {len(sarif_output['runs'][0]['results'])} issues")
        except Exception as e:
            print(f"Note: Could not convert Semgrep output to SARIF - {e}")
        CONVERT_EOF
        
    # 5. Upload Semgrep results to GitHub Security
    - name: Upload Semgrep SARIF
      uses: github/codeql-action/upload-sarif@v4
      if: always() && hashFiles('semgrep.sarif') != '' && github.event_name != 'pull_request_target'
      with:
        sarif_file: semgrep.sarif
        category: semgrep
        wait-for-processing: true

    # 6. Snyk (Software Composition Analysis - SCA)
    - name: Run Snyk to check for vulnerabilities
      uses: snyk/actions/python@v1
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        args: --all-projects --severity-threshold=high --json-file-output=snyk-report.json
      continue-on-error: true

    - name: Upload Snyk report
      if: always() && hashFiles('snyk-report.json') != ''
      uses: actions/upload-artifact@v4
      with:
        name: snyk-security-report
        path: snyk-report.json
        retention-days: 30

    # 7. Custom detection for sensitive files
    - name: Install dependencies for custom scan
      run: |
        python -m pip install --upgrade pip
        pip install requests colorama python-dotenv tqdm detect-secrets

    - name: Check if .gitignore properly excludes sensitive files
      run: |
        python << 'EOF'
        import os
        import re
        
        sensitive_patterns = [
            r'\.env',
            r'\.pem$',
            r'\.key$',
            r'\.p12$',
            r'\.pfx$',
            r'secrets\.json',
            r'credentials\.json',
            r'_secrets\.json',
        ]
        
        exclude_dirs = {'.git', '.github', '.pytest_cache', 'myenv', '__pycache__', '.venv', 'node_modules'}
        untracked_sensitive = []
        
        # Scan all files in repo
        for root, dirs, files in os.walk('.'):
            dirs[:] = [d for d in dirs if d not in exclude_dirs]
            
            for file in files:
                filepath = os.path.join(root, file).lstrip('./')
                
                for pattern in sensitive_patterns:
                    if re.search(pattern, filepath, re.IGNORECASE):
                        untracked_sensitive.append(filepath)
                        break
        
        if untracked_sensitive:
            print("[!] WARNING: Potential sensitive files found:")
            for f in untracked_sensitive:
                print(f"    - {f}")
            print("[!] Please add these to .gitignore")
        else:
            print("[+] No obvious sensitive files found")
        EOF

    - name: Run detect-secrets scan
      run: |
        detect-secrets scan --all-files --force-use-all-plugins --baseline .secrets.baseline
      continue-on-error: true

    - name: Run custom ShadowMapper security scan
      run: |
        python << 'EOF'
        import os
        import re
        
        # Patterns for common secrets detection
        secret_patterns = {
            'api_key': r'["\']?api[_-]?key["\']?\s*[:=]\s*["\']?[a-zA-Z0-9]{20,}',
            'aws_key': r'AKIA[0-9A-Z]{16}',
            'private_key': r'-----BEGIN (RSA|DSA|EC|OPENSSH) PRIVATE KEY',
            'db_connection': r'(postgres|mysql|mongodb)://[a-zA-Z0-9:@/\-_.~?]+',
            'jwt_token': r'eyJ[A-Za-z0-9_-]+\.eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+',
            'github_token': r'gh[pousr]_[A-Za-z0-9_]{36,255}',
            'password_in_code': r'password\s*[:=]\s*["\'][^"\']{6,}["\']',
            'env_var_exposed': r'export\s+\w+=["\'][^"\']{8,}["\']',
        }
        
        exclude_dirs = {'.git', '.github', 'myenv', '.pytest_cache', 'node_modules', '.venv', '__pycache__'}
        found_secrets = False
        
        for root, dirs, files in os.walk('.'):
            # Remove excluded directories
            dirs[:] = [d for d in dirs if d not in exclude_dirs]
            
            for file in files:
                # Skip binary files dan large files
                if file.endswith(('.pyc', '.so', '.dll', '.exe', '.bin', '.jpg', '.png', '.zip')):
                    continue
                
                filepath = os.path.join(root, file)
                try:
                    with open(filepath, 'r', encoding='utf-8', errors='ignore') as f:
                        content = f.read()
                        
                    for pattern_name, pattern in secret_patterns.items():
                        if re.search(pattern, content, re.IGNORECASE):
                            print(f"[!] SECURITY ALERT: Potential {pattern_name} found in {filepath}")
                            found_secrets = True
                except Exception as e:
                    continue
        
        if found_secrets:
            print("\n[!] FAILURE: Secrets detected! Do not push this code!")
            exit(1)
        else:
            print("[+] Custom scan passed: No obvious secrets detected")
        EOF

    - name: Report security scan results
      if: always()
      run: |
        echo "✅ Security Gate Checks Completed"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "✓ TruffleHog scan - High entropy secrets"
        echo "✓ GitGuardian scan - Known signatures"
        echo "✓ Semgrep SAST - Code vulnerabilities"
        echo "✓ .gitignore validation - File tracking"
        echo "✓ Custom pattern detection - Common secrets"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"