name: Security Scan Gate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install request colorama

    - name: Run ShadowMapper Secret Scan
      run: |
        # We will run custom unit tests to look for 'leaks' in our own code.
        python -c "from core.wayback import grep_sensitive_urls; import os; \
        files = [os.path.join(dp, f) for dp, dn, filenames in os.walk('.') for f in filenames if f.endswith('.py')]; \
        content = [open(f).read() for f in files]; \
        leaks = grep_sensitive_urls(content); \
        if leaks: print(f'SECURITY ALERT: Found potential secrets in code!'); exit(1)"